name: Courier Android E2E Sandbox

on:
  push:
    branches:
      - codex/mototake-courier-premium-ui
  workflow_dispatch:
    inputs:
      run_id:
        description: "Identificador QA para prefixo QA_COURIER_UI_CLOUD_"
        required: true
        type: string

jobs:
  courier-android-e2e:
    name: Courier Android E2E Sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: https://rotapronta-api-sandbox-production.up.railway.app/api
      EXPO_PUBLIC_SOCKET_URL: https://rotapronta-api-sandbox-production.up.railway.app
      MOTOTAKE_E2E_API_URL: https://rotapronta-api-sandbox-production.up.railway.app/api
      MOTOTAKE_E2E_PREFIX: QA_COURIER_UI_CLOUD_${{ inputs.run_id || github.run_id }}
      MOTOTAKE_E2E_RUN_ID: ${{ inputs.run_id || github.run_id }}
      DATABASE_URL: ${{ secrets.SANDBOX_DATABASE_URL }}
      MAESTRO_VERSION: 2.6.1

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          version: 10.7.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate sandbox health
        run: node -e "fetch(process.env.MOTOTAKE_E2E_API_URL + '/health').then(r => { if (!r.ok) process.exit(1); console.log('sandbox health ok'); })"

      - name: Static checks
        run: |
          pnpm --filter @deliveries/mobile typecheck
          pnpm --filter @deliveries/mobile lint
          pnpm --filter @deliveries/mobile build
          pnpm --filter @deliveries/mobile config:check
          cd apps/mobile
          pnpm dlx expo-doctor

      - name: Verify sandbox configuration
        run: |
          node -e "const eas=require('./apps/mobile/eas.json'); const env=eas.build['courier-e2e'].env; if (env.EXPO_PUBLIC_API_URL !== 'https://rotapronta-api-sandbox-production.up.railway.app/api') process.exit(1); if (env.EXPO_PUBLIC_SOCKET_URL !== 'https://rotapronta-api-sandbox-production.up.railway.app') process.exit(1);"

      - name: Generate native Android project
        run: pnpm --filter @deliveries/mobile exec expo prebuild --platform android --clean --no-install

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare QA sandbox data and Maestro flows
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "SANDBOX_DATABASE_URL secret ausente; abortando antes de criar dados QA."
            exit 1
          fi
          node apps/mobile/scripts/prepare-courier-e2e.mjs

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Run Maestro on Android emulator
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            maestro test apps/mobile/.maestro/courier/generated

      - name: Cleanup QA sandbox data
        if: always()
        run: node apps/mobile/scripts/cleanup-courier-e2e.mjs

      - name: Final sandbox health
        if: always()
        run: node -e "fetch(process.env.MOTOTAKE_E2E_API_URL + '/health').then(r => { if (!r.ok) process.exit(1); console.log('sandbox health ok'); })"
