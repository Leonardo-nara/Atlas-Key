appId: com.souzaworks.mototake
---
- clearState
- launchApp
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 60000
- tapOn:
    id: login-email
- inputText: "nao-existe-__RUNID__@example.test"
- tapOn:
    id: login-password
- inputText: "senha-invalida"
- tapOn:
    id: login-submit
- assertVisible: "Credenciais.*|Não foi possível.*|Nao foi possivel.*"
