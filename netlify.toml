[build]
  command = "pnpm --filter @deliveries/desktop build:renderer"
  publish = "apps/desktop/dist"

[build.environment]
  VITE_API_URL = "https://rotapronta-api-production.up.railway.app/api"
  VITE_SOCKET_URL = "https://rotapronta-api-production.up.railway.app"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
