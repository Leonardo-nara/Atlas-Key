name: Production health

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    name: Check public endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check health endpoints
        id: checks
        shell: bash
        run: |
          set -euo pipefail

          check_url() {
            local name="$1"
            local url="$2"
            local status
            status="$(curl -fsS -o /dev/null -w "%{http_code}" --max-time 15 "$url" || true)"
            echo "$name=$status" >> "$GITHUB_OUTPUT"
            if [ "$status" != "200" ]; then
              echo "$name failed with HTTP $status"
              return 1
            fi
          }

          failed=0
          check_url api_production "https://rotapronta-api-production.up.railway.app/api/health" || failed=1
          check_url api_production_readiness "https://rotapronta-api-production.up.railway.app/api/health/readiness" || failed=1
          check_url panel_production "https://mototake-painel.netlify.app" || failed=1
          check_url api_sandbox "https://rotapronta-api-sandbox-production.up.railway.app/api/health" || failed=1

          exit "$failed"

      - name: Open incident issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Incidente: health check publico falhou";
            const body = [
              "O workflow agendado detectou falha em pelo menos um endpoint publico.",
              "",
              `API producao: ${{ steps.checks.outputs.api_production || 'sem resposta' }}`,
              `Readiness producao: ${{ steps.checks.outputs.api_production_readiness || 'sem resposta' }}`,
              `Painel producao: ${{ steps.checks.outputs.panel_production || 'sem resposta' }}`,
              `API sandbox: ${{ steps.checks.outputs.api_sandbox || 'sem resposta' }}`,
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "incident",
              per_page: 20
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["incident", "production-health"]
            });
