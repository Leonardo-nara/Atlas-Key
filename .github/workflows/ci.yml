name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  security-and-diff:
    name: Security scan and diff check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret pattern scan
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E '(sk-[A-Za-z0-9]|sk-proj|sntrys_|rnd_[A-Za-z0-9]|AKIA[0-9A-Z]{16}|BEGIN (RSA|OPENSSH|PRIVATE) KEY|SENTRY_DSN=https://[^<[:space:]]+@)' -- . ':!pnpm-lock.yaml' ':!.github/workflows/ci.yml'; then
            echo "Potential secret pattern found. Review output without exposing values."
            exit 1
          fi
          if git grep -n -I -E '(ASAAS_API_KEY|DATABASE_URL|JWT_SECRET|PAYMENT_PROOF_S3_SECRET_ACCESS_KEY)=[^<[:space:]]{12,}' -- . ':!pnpm-lock.yaml' ':!.env.example' ':!.env.production.example' ':!docs/**'; then
            echo "Potential secret pattern found. Review output without exposing values."
            exit 1
          fi

      - name: Diff check
        run: git diff --check

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install backend workspace
        run: pnpm install --filter @deliveries/backend... --frozen-lockfile --prefer-offline --ignore-scripts --child-concurrency=1 --network-concurrency=4

      - name: Backend validation
        run: |
          pnpm --filter @deliveries/backend prisma:generate
          pnpm --filter @deliveries/backend test
          pnpm --filter @deliveries/backend typecheck
          pnpm --filter @deliveries/backend lint
          pnpm --filter @deliveries/backend build

      - name: Validate Prisma migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rotapronta_ci?schema=public
        run: pnpm --filter @deliveries/backend exec prisma validate --schema prisma/schema.prisma

      - name: Dependency audit
        run: pnpm audit --prod --audit-level high --ignore-registry-errors

  backend-e2e:
    name: Backend e2e with Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rotapronta_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rotapronta_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL_E2E: postgresql://postgres:postgres@localhost:5432/rotapronta_e2e?schema=rotapronta_e2e
      JWT_SECRET: e2e-local-only-secret-change-me
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_DAYS: 30
      API_PREFIX: api
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install backend workspace
        run: pnpm install --filter @deliveries/backend... --frozen-lockfile --prefer-offline --ignore-scripts --child-concurrency=1 --network-concurrency=4

      - name: Run backend e2e
        run: pnpm --filter @deliveries/backend test:e2e

  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install desktop workspace
        run: pnpm install --filter @deliveries/desktop... --frozen-lockfile --prefer-offline

      - name: Desktop validation
        run: |
          pnpm --filter @deliveries/desktop typecheck
          pnpm --filter @deliveries/desktop lint
          pnpm --filter @deliveries/desktop build

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install mobile workspace
        run: pnpm install --filter @deliveries/mobile... --frozen-lockfile --prefer-offline

      - name: Mobile validation
        run: |
          pnpm --filter @deliveries/mobile typecheck
          pnpm --filter @deliveries/mobile lint
          pnpm --filter @deliveries/mobile build
          pnpm --filter @deliveries/mobile config:check
